name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Actions 也執行和本機相同的 Canvas 路徑轉換。
      # Actions 的 checkout 是暫時工作目錄，所以 Build 後不需要恢復 Canvas。
      - name: Fix Canvas attachment paths
        shell: pwsh
        run: |
          ./fix-canvas-paths.ps1 `
            -Target "./content/vault_python_20260816" `
            -WebVaultRoot "/quartz/vault_python_20260816"

      - name: Build Quartz
        run: npx quartz build

      - name: Check Django and PDF output
        shell: bash
        run: |
          echo "===== Django output ====="
          find public -type f | grep -i "django" || true

          echo "===== PDF output ====="
          find public -type f | grep -i "\.pdf$" || true

          echo "===== Canvas output ====="
          find public -type f | grep -i "\.canvas" || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
