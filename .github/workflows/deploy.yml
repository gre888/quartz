name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js
      # ==========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. 安裝 Quartz dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. 修正 Obsidian Canvas 圖片 / PDF 路徑
      #
      # 例如：
      # attch/Python and Django(...).pdf
      #
      # 轉成 Quartz 網站使用的：
      # /quartz/vault_python_20260816/attch/
      # python-and-django(...).pdf
      # ==========================================
      - name: Fix Canvas attachment paths
        shell: pwsh
        run: |
          ./fix-canvas-paths.ps1 `
            -Target "./content/vault_python_20260816" `
            -WebVaultRoot "/quartz/vault_python_20260816"

      # ==========================================
      # 5. Build Quartz
      # ==========================================
      - name: Build Quartz
        run: npx quartz build

      # ==========================================
      # 6. Debug：確認 Django / PDF 有產生
      # ==========================================
      - name: Check Django and PDF output
        shell: bash
        run: |
          echo "========================================"
          echo "Django output"
          echo "========================================"
          find public -type f | grep -i "django" || true

          echo ""
          echo "========================================"
          echo "PDF output"
          echo "========================================"
          find public -type f | grep -i "\.pdf$" || true

          echo ""
          echo "========================================"
          echo "Canvas output"
          echo "========================================"
          find public -type f | grep -i "\.canvas" || true

      # ==========================================
      # 7. Setup GitHub Pages
      # ==========================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ==========================================
      # 8. Upload public
      # ==========================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # ==========================================
  # Deploy
  # ==========================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4